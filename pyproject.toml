[project]
name = "orchspec"
version = "0.1.0"
description = "Score-aware orchestral spectral visualizer (local-only)"
readme = "README.md"
authors = [
    { name = "nhoffman3225", email = "291149338+nhoffman3225@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "librosa>=1.0,<2",
    "soundfile>=0.13",
    "numpy>=2.1",
    "pyloudnorm>=0.1.1",
    "pydantic>=2.9",
    "typer>=0.15",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
gpu = ["torch>=2.8"]
dev = [
    "ruff>=0.9",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "hypothesis>=6.120",
    "httpx>=0.28",
]

[project.scripts]
orchspec = "orchspec.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

# --- PyTorch CUDA wheels (Blackwell sm_120 needs cu128+). macOS uses PyPI (CPU/MPS). ---
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform != 'darwin'" }]

# --- tooling ---
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "PTH", "RUF"]
ignore = ["S101"]  # assert is fine in tests and internal invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-hosts=127.0.0.1,localhost -ra"
markers = [
    "gpu: requires CUDA (skipped when unavailable)",
    "slow: long-running perf smoke tests",
    "real: uses private sessions in session/ (local only; run with -m real)",
]
