[package]
name = "orchspec-desktop"
version = "0.1.0"
description = "orchspec desktop app (Tauri 2): the viewer + a local bundle, no network"
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
orchspec-core = { path = "../../rust/orchspec-core" }
# custom-protocol: embed the viewer build (the app never uses a dev server URL)
tauri = { version = "2.11.6", features = ["custom-protocol"] }
tauri-plugin-dialog = "2.7.3"
# (already in the tree via orchspec-core and tauri) /app/ route bodies
serde_json = "1.0.151"
