<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; img-src 'self' blob: data:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>orchspec</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="bar">
        <button id="play" type="button" title="Play/pause (Space)">▶</button>
        <button id="pianobtn" type="button" title="Full-screen piano view (P); Esc to close">🎹 piano</button>
        <span id="time">0:00.00 / 0:00.00</span>
        <span id="barbeat"></span>
        <label>window <select id="window"></select></label>
        <label>view
          <select id="mode">
            <option value="mix">mix</option>
            <option value="ensemble">full ensemble (all stems)</option>
            <option value="stems">selected stems</option>
            <option value="dominant">color by dominant stem</option>
          </select>
        </label>
        <label>colors <select id="cmap"></select></label>
        <label>style
          <select id="style" title="surface: colormapped relief · terrain: hillshade + contours (3 dB, index every 15 dB) · fabric: glowing mesh">
            <option value="surface">surface</option>
            <option value="terrain">terrain (contours)</option>
            <option value="fabric">fabric (mesh)</option>
          </select>
        </label>
        <label title="Gaussian smoothing width in semitones (0 = raw). Merges partials into the ensemble's spectral envelope so register gaps stand out.">smooth <input id="smooth" type="range" min="0" max="12" step="0.5" value="0" /> <span id="smoothval">off</span></label>
        <label title="Outline the score's notes (colored by part; dashed = weak fundamental)">
          <input id="notes" type="checkbox" checked /> notes</label>
        <label title="Keep only a band around each sounding note's fundamental (hides overtones). Uses the score/MIDI, or per-stem f0 tracks when there is no score.">
          <input id="fund" type="checkbox" /> fundamentals ±
          <select id="fundw">
            <option value="25">25¢</option>
            <option value="50" selected>50¢</option>
            <option value="100">100¢</option>
          </select>
        </label>
        <label title="With fundamentals on: also let overtones (2nd..16th harmonic of each note) through wherever they are at least this loud. Leftmost = off, then 0 dB; move right to let quieter harmonics in.">
          + harmonics ≥ <input id="harm" type="range" min="0" max="97" step="1" value="0" list="harmticks" />
          <span id="harmval">off</span>
          <select id="harmpreset" title="Preset thresholds">
            <option value="">preset…</option>
          </select>
          <datalist id="harmticks"></datalist>
        </label>
        <label title="Heat map on the keyboard: recent activity per key, fading with time constant τ. sound = measured energy at the key (follows the audio's decay); notes = how much the score plays there.">
          key heat <select id="heat">
            <option value="off">off</option>
            <option value="sound" selected>sound</option>
            <option value="notes">notes</option>
          </select>
          τ <input id="tau" type="range" min="0.2" max="6" step="0.1" value="1.5" />
          <span id="tauval">1.5 s</span>
        </label>
        <label title="Spectral gaps: quiet pitch regions inside the ensemble's sounding span">
          <input id="gaps" type="checkbox" /> gaps ≤
          <input id="gapdb" type="range" min="-90" max="-15" step="1" value="-50" />
          <span id="gapval">-50 dB</span>
        </label>
        <label>floor <input id="floor" type="range" min="0" max="0.9" step="0.01" value="0.3" /></label>
        <label>height <input id="height" type="range" min="0.05" max="3" step="0.01" value="0.45" /></label>
        <label><input id="follow" type="checkbox" checked /> follow</label>
        <label><input id="grid" type="checkbox" checked /> C lines</label>
        <label>vol <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" /></label>
        <span id="gapinfo"></span>
        <span id="title"></span>
      </header>
      <main id="main">
        <div id="view3d"><canvas id="gl"></canvas></div>
        <aside id="stems" hidden>
          <div class="stems-head">
            <strong>Stems</strong>
            <button id="stems-all" type="button">all</button>
            <button id="stems-none" type="button">none</button>
          </div>
          <ul id="stem-list"></ul>
          <section id="parts-sec" hidden>
            <div class="stems-head"><strong>Parts</strong>
              <button id="parts-all" type="button">all</button>
              <button id="parts-none" type="button">none</button>
            </div>
            <ul id="part-list"></ul>
            <p class="hint">Click a name to show its range on the keyboard.</p>
          </section>
        </aside>
      </main>
      <section id="pane" title="wheel: stretch pitch axis · shift+wheel: pan · double-click: reset">
        <canvas id="cqt2d"></canvas>
        <div id="tip" hidden></div>
      </section>
      <canvas id="lufs"></canvas>
      <div id="status">loading…</div>
      <div id="pianoview" hidden>
        <div id="piano-bar">
          <strong>Piano</strong>
          <span id="piano-time"></span>
          <label title="How far ahead the falling notes are shown">lookahead
            <input id="lookahead" type="range" min="1" max="12" step="0.5" value="4" />
            <span id="lookval">4 s</span></label>
          <label title="Stretch the keyboard vertically">key height
            <input id="keyh" type="range" min="0.5" max="2.5" step="0.1" value="1" /></label>
          <label><input id="pspec" type="checkbox" checked /> live spectrum</label>
          <span class="hint">wheel: stretch time · Space play/pause · ←/→ seek · Esc close</span>
          <button id="pianoclose" type="button">✕ close</button>
        </div>
        <canvas id="piano"></canvas>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
