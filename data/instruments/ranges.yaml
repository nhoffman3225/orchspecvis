# Instrument ranges (SOUNDING pitch, MIDI numbers; A0 = 21, middle C = 60).
#
# Schema (one entry per instrument, keyed by a stable lowercase id):
#
#   <instrument_id>:
#     name: str                 # display name, e.g. "Horn in F"
#     family: str               # woodwinds | brass | percussion | keyboards | strings | voices
#     sounding_range: [int, int]    # lowest..highest SOUNDING pitch (full professional range)
#     practical_range: [int, int]   # optional; comfortable orchestral range (sounding)
#     transposition: int        # semitones written -> sounding (horn in F = -7,
#                               # piccolo = +12, double bass = -12, clarinet in Bb = -2)
#     aliases: [str]            # matched against MusicXML part/instrument names and stem
#                               # player names after normalization (score/match.normalize);
#                               # the longest matching alias wins
#     source: str               # citation for the range data
#
# Values are approximate, compiled from standard orchestration references (Adler, The
# Study of Orchestration, 4th ed.; Blatter, Instrumentation and Orchestration). Ranges vary
# with instrument model, extensions and sample library; treat them as guides (see PLAN.md
# "Unverified assumptions").

