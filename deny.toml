# cargo-deny policy (supply chain for the Rust core and the desktop app).
#   cargo deny check        # advisories, licenses, bans, sources
# CI runs it in the rust-core job. Keep the license list in step with CREDITS.md.

[graph]
all-features = false

[advisories]
# RustSec advisory database: any known vulnerability or yanked crate fails the check;
# unmaintained crates are reported for workspace dependencies only
yanked = "deny"
unmaintained = "workspace"

[licenses]
# permissive licences, plus MPL-2.0 (file-level copyleft; used unmodified)
allow = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "0BSD", "Unlicense",
    "BSL-1.0", "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow" # Tauri's tree has many duplicate versions; not a security issue
wildcards = "deny"
allow-wildcard-paths = true # our own path dependencies

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
