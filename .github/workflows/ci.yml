name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Python deps (CPU; no gpu extra in CI)
        run: uv sync --locked --extra dev

      - name: Lint (ruff, pyright)
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright

      - name: pytest
        run: uv run pytest -m "not gpu and not slow and not real"

      - name: Viewer install
        working-directory: viewer
        run: npm ci

      - name: Viewer lint + tests + build
        working-directory: viewer
        run: |
          npm run lint
          npm test
          npm run build

      - name: Viewer E2E (Playwright; no off-origin requests, score + piano views)
        working-directory: viewer
        run: |
          npx playwright install chromium
          npx playwright test
