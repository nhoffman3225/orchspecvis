name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a new push to the same PR cancels the run still in progress (saves minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Python deps (CPU; no gpu extra in CI)
        run: uv sync --locked --extra dev

      - name: Lint (ruff, pyright)
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright

      - name: pytest
        run: uv run pytest -m "not gpu and not slow and not real"

      - name: Viewer install
        working-directory: viewer
        run: npm ci

      - name: Viewer lint + tests + build
        working-directory: viewer
        run: |
          npm run lint
          npm test
          npm run build

  # Browser E2E runs once, on Linux (the cheapest runner); the OS matrix above covers the
  # Python core and the viewer unit tests + build.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Test bundle (synthetic score session)
        run: |
          uv sync --locked --extra dev
          uv run pytest tests/test_score_bundle.py

      - name: Viewer install
        working-directory: viewer
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Viewer E2E (Playwright; no off-origin requests, score + piano views)
        working-directory: viewer
        run: npx playwright test

      - name: Upload E2E results on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-results
          path: viewer/test-results/
          retention-days: 7

  # Rust bundle core (Phase 3b): cross-checked against bundles the Python writer produces.
  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-core-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Python-written test bundle (gzip tiles + score)
        run: |
          uv sync --locked --extra dev
          uv run pytest tests/test_score_bundle.py

      - name: cargo test / clippy (orchspec-core)
        run: |
          cargo test -p orchspec-core --locked
          cargo clippy -p orchspec-core --locked --all-targets -- -D warnings
