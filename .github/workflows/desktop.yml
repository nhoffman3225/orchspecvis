name: desktop

# Checks the Tauri desktop shell on Windows, only when Rust/desktop code changes (Windows
# minutes bill at 2x; viewer edits do not change the Rust build). PRs: clippy (type check
# + lints, no link); pushes to main: a full build too. Core tests run in ci.yml on Linux.
on:
  pull_request:
    paths:
      - "desktop/**"
      - "rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "rust/**"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0 # CI builds are one-shot: incremental data only bloats the cache
  CARGO_PROFILE_DEV_DEBUG: 0 # no debug info: faster links, smaller cache

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-desktop-${{ github.event.repository.name }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Viewer build (embedded into the app)
        working-directory: viewer
        run: |
          npm ci
          npm run build

      - name: clippy (desktop shell)
        run: cargo clippy -p orchspec-desktop --locked -- -D warnings

      - name: full build (main only)
        if: github.event_name == 'push'
        run: cargo build -p orchspec-desktop --locked
