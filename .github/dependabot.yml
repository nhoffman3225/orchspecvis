# Dependabot version updates: weekly, grouped (one PR per ecosystem for minor/patch
# updates) so dependencies stay patched without a flood of PRs. Security updates for
# known vulnerabilities come separately and immediately when Dependabot alerts are on.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule: { interval: weekly }
    groups: { python: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: "/viewer"
    schedule: { interval: weekly }
    groups: { viewer: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: "/desktop"
    schedule: { interval: weekly }
    groups: { desktop: { update-types: [minor, patch] } }
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: weekly }
    groups: { rust: { update-types: [minor, patch] } }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups: { actions: { update-types: [minor, patch] } }
